# Implements gates 1–3 of the 12-gate pipeline in docs/03-architecture/09-devops-and-cicd.md §3
# (build & analysers, architecture tests, unit + property tests) — the gates that have real content
# to run against as of M0 Slice 1. Gates 4–8 and 10–12 (golden files, determinism, historical
# corpus, contract tests, no-frills build, rule coverage, Bicep what-if, Flutter) arrive as the
# slices that give them something to check land; gate 9 (security scans) is worth adding on its own
# regardless of which slice, next.
name: PR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & analysers, architecture tests, unit + property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore atlas.sln

      - run: dotnet build atlas.sln --no-restore --configuration Release

      - run: dotnet format atlas.sln --verify-no-changes --no-restore

      - run: dotnet test atlas.sln --no-build --configuration Release

  local-dev-smoke:
    # A continuously-verified proof of NFR-609's documented local-dev path (docs/03-architecture/
    # 09-devops-and-cicd.md §7), not a claim in a README nobody re-checks.
    name: docker-compose local dev smoke test (NFR-609)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: docker compose up
        run: docker compose up -d --wait

      - name: Run Atlas.Host in the background
        run: |
          dotnet run --project src/Atlas.Host --urls http://localhost:5299 &
          echo $! > host.pid

      - name: Wait for the host to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5299/health; then exit 0; fi
            sleep 2
          done
          echo "Host never became healthy" >&2
          exit 1

      # The M0 exit gate's "1,000 synthetic entries post, balance, and query correctly at arbitrary
      # bitemporal coordinates" (docs/01-product/08-roadmap-and-milestones.md), proven on every push:
      # atlas-seed posts a 10-year synthetic life and independently verifies every balance it checks.
      - name: Seed and verify (M0 exit gate)
        run: dotnet run --project tools/atlas-seed -- --years 10 --seed 42 --host http://localhost:5299

      # M1 Slice 2: the CSV import endpoint, exercised over real HTTP — one malformed row must not
      # lose the batch, and the two valid rows must post and net to the expected balance.
      - name: Import a CSV and verify the result (M1 ingestion)
        run: |
          set -euo pipefail
          TENANT=$(python3 -c "import uuid; print(uuid.uuid4())")

          CHECKING=$(curl -sf -X POST http://localhost:5299/ledger/accounts -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"code\":\"1.1.ci-ingest\",\"name\":\"Checking\",\"type\":\"Asset\",\"commodity\":\"BRL\",\"parentId\":null,\"openedAt\":\"2026-01-01T00:00:00Z\"}")
          UNCLASSIFIED=$(curl -sf -X POST http://localhost:5299/ledger/accounts -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"code\":\"5.9.ci-unclassified\",\"name\":\"Unclassified\",\"type\":\"Expense\",\"commodity\":\"BRL\",\"parentId\":null,\"openedAt\":\"2026-01-01T00:00:00Z\"}")

          CHECKING_ID=$(echo "$CHECKING" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          UNCLASSIFIED_ID=$(echo "$UNCLASSIFIED" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")

          python3 - "$TENANT" "$CHECKING_ID" "$UNCLASSIFIED_ID" <<'PYEOF' > import_request.json
          import json, sys
          tenant, checking, unclassified = sys.argv[1:4]
          print(json.dumps({
              "tenantId": tenant,
              "sourceId": "ci-bank",
              "csvContent": "date,description,amount\n2026-01-05,Salary,8000.00\nnot-a-date,Broken,50.00\n2026-01-06,Groceries,-150.50\n",
              "columnMapping": {
                  "primaryAccountId": checking, "unclassifiedAccountId": unclassified, "commodity": "BRL",
                  "dateColumnIndex": 0, "descriptionColumnIndex": 1, "amountColumnIndex": 2, "hasHeaderRow": True,
              },
              "decisionTime": "2026-01-06T12:00:00Z",
              "currentTradingDayClose": "2026-01-07T00:00:00Z",
          }))
          PYEOF

          RESULT=$(curl -sf -X POST http://localhost:5299/ingestion/csv-imports -H "Content-Type: application/json" -d @import_request.json)
          echo "$RESULT"
          echo "$RESULT" | python3 -c "
          import json, sys
          result = json.load(sys.stdin)
          assert result['rowsParsed'] == 2, result
          assert result['entriesPosted'] == 2, result
          assert len(result['parseFailures']) == 1, result
          assert result['duplicatesSkipped'] == 0, result
          "

          BALANCE=$(curl -sf "http://localhost:5299/ledger/accounts/$CHECKING_ID/balance?tenantId=$TENANT&commodity=BRL&asOfValidTime=2026-02-01T00:00:00Z&asOfDecisionTime=2026-02-01T00:00:00Z")
          echo "$BALANCE" | python3 -c "
          import json, sys
          balance = json.load(sys.stdin)
          assert balance['amountMinorUnits'] == 784950, balance  # 8000.00 - 150.50
          "

      # FR-108: OFX 1.x tag-soup (no closing tags on leaves) parses the same way CSV does, and
      # FITID-based idempotency (Decision 0012) means reimporting the same statement dedups cleanly.
      - name: Import an OFX statement and verify the result (M1 ingestion)
        run: |
          set -euo pipefail
          TENANT=$(python3 -c "import uuid; print(uuid.uuid4())")

          CHECKING=$(curl -sf -X POST http://localhost:5299/ledger/accounts -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"code\":\"1.1.ci-ofx\",\"name\":\"Checking\",\"type\":\"Asset\",\"commodity\":\"BRL\",\"parentId\":null,\"openedAt\":\"2026-01-01T00:00:00Z\"}")
          UNCLASSIFIED=$(curl -sf -X POST http://localhost:5299/ledger/accounts -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"code\":\"5.9.ci-ofx-unclassified\",\"name\":\"Unclassified\",\"type\":\"Expense\",\"commodity\":\"BRL\",\"parentId\":null,\"openedAt\":\"2026-01-01T00:00:00Z\"}")
          CHECKING_ID=$(echo "$CHECKING" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          UNCLASSIFIED_ID=$(echo "$UNCLASSIFIED" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")

          python3 - "$TENANT" "$CHECKING_ID" "$UNCLASSIFIED_ID" <<'PYEOF' > ofx_request.json
          import json, sys
          tenant, checking, unclassified = sys.argv[1:4]
          ofx = (
              "<OFX><BANKMSGSRSV1><STMTTRNRS><STMTRS><BANKTRANLIST>\n"
              "<STMTTRN><TRNTYPE>CREDIT<DTPOSTED>20260105120000<TRNAMT>8000.00<FITID>ci-ofx-1<NAME>Salary\n"
              "</STMTTRN>\n"
              "<STMTTRN><TRNTYPE>DEBIT<DTPOSTED>20260106<TRNAMT>-150.50<FITID>ci-ofx-2<NAME>Groceries\n"
              "</STMTTRN>\n"
              "</BANKTRANLIST></STMTRS></STMTTRNRS></BANKMSGSRSV1></OFX>\n"
          )
          print(json.dumps({
              "tenantId": tenant, "sourceId": "ci-bank-ofx", "ofxContent": ofx,
              "primaryAccountId": checking, "unclassifiedAccountId": unclassified, "commodity": "BRL",
              "decisionTime": "2026-01-06T12:00:00Z", "currentTradingDayClose": "2026-01-07T00:00:00Z",
          }))
          PYEOF

          RESULT=$(curl -sf -X POST http://localhost:5299/ingestion/ofx-imports -H "Content-Type: application/json" -d @ofx_request.json)
          echo "$RESULT"
          echo "$RESULT" | python3 -c "
          import json, sys
          result = json.load(sys.stdin)
          assert result['rowsParsed'] == 2, result
          assert result['entriesPosted'] == 2, result
          assert len(result['parseFailures']) == 0, result
          "

          # Reimporting the same statement (same FITIDs) must dedup to zero new entries.
          REIMPORT=$(curl -sf -X POST http://localhost:5299/ingestion/ofx-imports -H "Content-Type: application/json" -d @ofx_request.json)
          echo "$REIMPORT" | python3 -c "
          import json, sys
          result = json.load(sys.stdin)
          assert result['entriesPosted'] == 0, result
          assert result['duplicatesSkipped'] == 2, result
          "

          BALANCE=$(curl -sf "http://localhost:5299/ledger/accounts/$CHECKING_ID/balance?tenantId=$TENANT&commodity=BRL&asOfValidTime=2026-02-01T00:00:00Z&asOfDecisionTime=2026-02-01T00:00:00Z")
          echo "$BALANCE" | python3 -c "
          import json, sys
          balance = json.load(sys.stdin)
          assert balance['amountMinorUnits'] == 784950, balance  # unchanged by the reimport
          "

      # FR-110: a manual entry and a bank-fed entry for the same real-world transfer must both
      # still post (never auto-merged) while getting flagged as a probable duplicate.
      - name: Fuzzy cross-source duplicate detection (M1 ingestion)
        run: |
          set -euo pipefail
          TENANT=$(python3 -c "import uuid; print(uuid.uuid4())")

          CHECKING=$(curl -sf -X POST http://localhost:5299/ledger/accounts -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"code\":\"1.1.ci-fuzzy\",\"name\":\"Checking\",\"type\":\"Asset\",\"commodity\":\"BRL\",\"parentId\":null,\"openedAt\":\"2026-01-01T00:00:00Z\"}")
          UNCLASSIFIED=$(curl -sf -X POST http://localhost:5299/ledger/accounts -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"code\":\"5.9.ci-fuzzy-unclassified\",\"name\":\"Unclassified\",\"type\":\"Expense\",\"commodity\":\"BRL\",\"parentId\":null,\"openedAt\":\"2026-01-01T00:00:00Z\"}")
          CHECKING_ID=$(echo "$CHECKING" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          UNCLASSIFIED_ID=$(echo "$UNCLASSIFIED" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")

          curl -sf -X POST http://localhost:5299/ledger/entries -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"validTime\":\"2026-01-05T12:00:00Z\",\"decisionTime\":\"2026-01-05T12:00:00Z\",\"currentTradingDayClose\":\"2026-01-06T00:00:00Z\",\"description\":\"Joao\",\"sourceId\":\"manual\",\"idempotencyKey\":\"ci-manual-$TENANT\",\"postings\":[{\"accountId\":\"$UNCLASSIFIED_ID\",\"amountMinorUnits\":120000,\"commodity\":\"BRL\",\"direction\":\"Debit\"},{\"accountId\":\"$CHECKING_ID\",\"amountMinorUnits\":120000,\"commodity\":\"BRL\",\"direction\":\"Credit\"}]}" > /dev/null

          python3 - "$TENANT" "$CHECKING_ID" "$UNCLASSIFIED_ID" <<'PYEOF' > fuzzy_import.json
          import json, sys
          tenant, checking, unclassified = sys.argv[1:4]
          print(json.dumps({
              "tenantId": tenant,
              "sourceId": "ci-bank",
              "csvContent": "date,description,amount\n2026-01-06,JOAO S,-1200.00\n",
              "columnMapping": {
                  "primaryAccountId": checking, "unclassifiedAccountId": unclassified, "commodity": "BRL",
                  "dateColumnIndex": 0, "descriptionColumnIndex": 1, "amountColumnIndex": 2, "hasHeaderRow": True,
              },
              "decisionTime": "2026-01-06T12:00:00Z",
              "currentTradingDayClose": "2026-01-07T00:00:00Z",
          }))
          PYEOF

          RESULT=$(curl -sf -X POST http://localhost:5299/ingestion/csv-imports -H "Content-Type: application/json" -d @fuzzy_import.json)
          echo "$RESULT"
          echo "$RESULT" | python3 -c "
          import json, sys
          result = json.load(sys.stdin)
          assert result['entriesPosted'] == 1, result       # never suppressed
          assert result['duplicatesSkipped'] == 0, result   # not a BR-103 exact duplicate
          assert result['duplicateCandidatesFlagged'] == 1, result
          "

      # FR-111, BR-108, US-012: an exact-match reported balance reconciles; a discrepancy beyond
      # the one-major-unit tolerance (Decision 0008) breaches without ever adjusting the ledger.
      - name: Reconciliation (M1 ingestion)
        run: |
          set -euo pipefail
          TENANT=$(python3 -c "import uuid; print(uuid.uuid4())")

          CHECKING=$(curl -sf -X POST http://localhost:5299/ledger/accounts -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"code\":\"1.1.ci-recon\",\"name\":\"Checking\",\"type\":\"Asset\",\"commodity\":\"BRL\",\"parentId\":null,\"openedAt\":\"2026-01-01T00:00:00Z\"}")
          UNCLASSIFIED=$(curl -sf -X POST http://localhost:5299/ledger/accounts -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"code\":\"5.9.ci-recon-unclassified\",\"name\":\"Unclassified\",\"type\":\"Expense\",\"commodity\":\"BRL\",\"parentId\":null,\"openedAt\":\"2026-01-01T00:00:00Z\"}")
          CHECKING_ID=$(echo "$CHECKING" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          UNCLASSIFIED_ID=$(echo "$UNCLASSIFIED" | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")

          curl -sf -X POST http://localhost:5299/ledger/entries -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"validTime\":\"2026-01-05T12:00:00Z\",\"decisionTime\":\"2026-01-05T12:00:00Z\",\"currentTradingDayClose\":\"2026-01-06T00:00:00Z\",\"description\":\"opening balance\",\"sourceId\":\"manual\",\"idempotencyKey\":\"ci-recon-manual-$TENANT\",\"postings\":[{\"accountId\":\"$CHECKING_ID\",\"amountMinorUnits\":800000,\"commodity\":\"BRL\",\"direction\":\"Debit\"},{\"accountId\":\"$UNCLASSIFIED_ID\",\"amountMinorUnits\":800000,\"commodity\":\"BRL\",\"direction\":\"Credit\"}]}" > /dev/null

          EXACT=$(curl -sf -X POST http://localhost:5299/ingestion/reconciliations -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"sourceId\":\"ci-bank\",\"accountId\":\"$CHECKING_ID\",\"commodity\":\"BRL\",\"reportedAmountMinorUnits\":800000,\"asOfValidTime\":\"2026-01-06T00:00:00Z\",\"asOfDecisionTime\":\"2026-01-06T00:00:00Z\"}")
          echo "$EXACT"
          echo "$EXACT" | python3 -c "
          import json, sys
          result = json.load(sys.stdin)
          assert result['isReconciled'] is True, result
          assert result['discrepancyMinorUnits'] == 0, result
          "

          DRIFT=$(curl -sf -X POST http://localhost:5299/ingestion/reconciliations -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"sourceId\":\"ci-bank\",\"accountId\":\"$CHECKING_ID\",\"commodity\":\"BRL\",\"reportedAmountMinorUnits\":803891,\"asOfValidTime\":\"2026-01-06T00:00:00Z\",\"asOfDecisionTime\":\"2026-01-06T00:00:00Z\"}")
          echo "$DRIFT"
          echo "$DRIFT" | python3 -c "
          import json, sys
          result = json.load(sys.stdin)
          assert result['isReconciled'] is False, result
          assert result['discrepancyMinorUnits'] == 3891, result
          "

          # BR-108: never a silent adjustment — the ledger balance must be untouched by reconciling.
          BALANCE=$(curl -sf "http://localhost:5299/ledger/accounts/$CHECKING_ID/balance?tenantId=$TENANT&commodity=BRL&asOfValidTime=2026-01-06T00:00:00Z&asOfDecisionTime=2026-01-06T00:00:00Z")
          echo "$BALANCE" | python3 -c "
          import json, sys
          balance = json.load(sys.stdin)
          assert balance['amountMinorUnits'] == 800000, balance
          "

      # FR-201, FR-202, INV-040, INV-043: buy 100 @ R$30,00, buy 50 @ R$36,00, sell 60 — weighted-
      # average unit cost is R$32,00 throughout, and Positions' synced quantity must exactly match
      # the ledger's own quantity for the position account (Decision 0010's 4-leg trade shape, forced
      # by BR-100's per-commodity balancing).
      - name: Lots and custo médio (M1 positions)
        run: |
          set -euo pipefail
          TENANT=$(python3 -c "import uuid; print(uuid.uuid4())")

          curl -sf -X POST http://localhost:5299/positions/instruments -H "Content-Type: application/json" \
            -d '{"symbol":"CI.PETR4","kind":"Equity","minorUnitScale":0,"jurisdiction":"BR"}'

          open_account() {
            curl -sf -X POST http://localhost:5299/ledger/accounts -H "Content-Type: application/json" \
              -d "{\"tenantId\":\"$TENANT\",\"code\":\"$1\",\"name\":\"$2\",\"type\":\"Asset\",\"commodity\":\"$3\",\"parentId\":null,\"openedAt\":\"2026-01-01T00:00:00Z\"}" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])"
          }

          POSITION_ACCT=$(open_account "1.2.ci-petr4" "PETR4 Holdings" "CI.PETR4")
          CLEARING_PETR4=$(open_account "1.9.ci-petr4-clearing" "PETR4 Trading Clearing" "CI.PETR4")
          CASH_ACCT=$(open_account "1.1.ci-positions-cash" "Brokerage Cash" "BRL")
          CLEARING_BRL=$(open_account "1.9.ci-brl-clearing" "BRL Trading Clearing" "BRL")

          post_trade() {
            local valid="$1" qty="$2" cash="$3" posDir="$4" clrDir="$5" cashClrDir="$6" cashDir="$7"
            curl -sf -X POST http://localhost:5299/ledger/entries -H "Content-Type: application/json" -d "{
              \"tenantId\":\"$TENANT\",\"validTime\":\"$valid\",\"decisionTime\":\"$valid\",
              \"currentTradingDayClose\":\"2026-02-01T00:00:00Z\",\"description\":\"CI trade\",\"sourceId\":\"manual\",
              \"idempotencyKey\":\"ci-trade-$(python3 -c 'import uuid; print(uuid.uuid4())')\",
              \"postings\":[
                {\"accountId\":\"$POSITION_ACCT\",\"amountMinorUnits\":$qty,\"commodity\":\"CI.PETR4\",\"direction\":\"$posDir\"},
                {\"accountId\":\"$CLEARING_PETR4\",\"amountMinorUnits\":$qty,\"commodity\":\"CI.PETR4\",\"direction\":\"$clrDir\"},
                {\"accountId\":\"$CLEARING_BRL\",\"amountMinorUnits\":$cash,\"commodity\":\"BRL\",\"direction\":\"$cashClrDir\"},
                {\"accountId\":\"$CASH_ACCT\",\"amountMinorUnits\":$cash,\"commodity\":\"BRL\",\"direction\":\"$cashDir\"}
              ]}" > /dev/null
          }

          post_trade "2026-01-05T12:00:00Z" 100 300000 "Debit" "Credit" "Debit" "Credit"   # buy 100 @ R$30,00
          post_trade "2026-01-06T12:00:00Z" 50 180000 "Debit" "Credit" "Debit" "Credit"    # buy 50 @ R$36,00
          post_trade "2026-01-07T12:00:00Z" 60 210000 "Credit" "Debit" "Credit" "Debit"    # sell 60 @ R$35,00

          SYNCED=$(curl -sf -X POST http://localhost:5299/positions/sync -H "Content-Type: application/json" -d "{
            \"tenantId\":\"$TENANT\",\"positionAccountId\":\"$POSITION_ACCT\",\"cashAccountId\":\"$CASH_ACCT\",
            \"commodity\":\"CI.PETR4\",\"costCommodity\":\"BRL\",
            \"asOfValidTime\":\"2026-01-08T00:00:00Z\",\"asOfDecisionTime\":\"2026-01-08T00:00:00Z\"}")
          echo "$SYNCED"
          echo "$SYNCED" | python3 -c "
          import json, sys
          position = json.load(sys.stdin)
          assert position['quantity'] == 90, position
          assert position['costBasisMinorUnits'] == 288000, position
          assert position['averageUnitCostMinorUnits'] == 3200, position
          assert len(position['lots']) == 2, position
          assert len(position['disposals']) == 1, position
          "

          # INV-040: Positions' synced quantity must exactly equal the ledger's own quantity.
          LEDGER_BALANCE=$(curl -sf "http://localhost:5299/ledger/accounts/$POSITION_ACCT/balance?tenantId=$TENANT&commodity=CI.PETR4&asOfValidTime=2026-01-08T00:00:00Z&asOfDecisionTime=2026-01-08T00:00:00Z")
          echo "$LEDGER_BALANCE" | python3 -c "
          import json, sys
          balance = json.load(sys.stdin)
          assert balance['amountMinorUnits'] == 90, balance
          "

      # FR-301, INV-060, US-013: reclassifying a category never overwrites the original decision —
      # both remain in the audit trail, and only the most recent one is "current". A non-Expense
      # account is rejected outright (Decision 0011: a category is exactly a Ledger Expense account).
      - name: Expense classification (M1 cashflow)
        run: |
          set -euo pipefail
          TENANT=$(python3 -c "import uuid; print(uuid.uuid4())")

          CATEGORY=$(curl -sf -X POST http://localhost:5299/ledger/accounts -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"code\":\"5.1.ci-saude\",\"name\":\"Plano de saude\",\"type\":\"Expense\",\"commodity\":\"BRL\",\"parentId\":null,\"openedAt\":\"2026-01-01T00:00:00Z\"}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")

          curl -sf -X POST "http://localhost:5299/cashflow/categories/$CATEGORY/classify" -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"classification\":\"Discretionary\",\"rationale\":\"initial guess\",\"decidedAt\":\"2026-01-05T12:00:00Z\"}" > /dev/null

          curl -sf -X POST "http://localhost:5299/cashflow/categories/$CATEGORY/classify" -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"classification\":\"Essential\",\"rationale\":\"health plan premium\",\"decidedAt\":\"2026-02-04T12:00:00Z\"}" > /dev/null

          RESULT=$(curl -sf "http://localhost:5299/cashflow/categories/$CATEGORY/classification?tenantId=$TENANT")
          echo "$RESULT"
          echo "$RESULT" | python3 -c "
          import json, sys
          result = json.load(sys.stdin)
          assert result['current']['classification'] == 'Essential', result
          assert len(result['history']) == 2, result
          assert result['history'][0]['classification'] == 'Discretionary', result
          "

          CHECKING=$(curl -sf -X POST http://localhost:5299/ledger/accounts -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"code\":\"1.1.ci-cashflow-checking\",\"name\":\"Checking\",\"type\":\"Asset\",\"commodity\":\"BRL\",\"parentId\":null,\"openedAt\":\"2026-01-01T00:00:00Z\"}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")

          STATUS=$(curl -s -o /tmp/classify_rejection.json -w "%{http_code}" -X POST "http://localhost:5299/cashflow/categories/$CHECKING/classify" -H "Content-Type: application/json" \
            -d "{\"tenantId\":\"$TENANT\",\"classification\":\"Discretionary\",\"rationale\":null,\"decidedAt\":\"2026-01-05T12:00:00Z\"}")
          test "$STATUS" -eq 400
          python3 -c "
          import json
          result = json.load(open('/tmp/classify_rejection.json'))
          assert result['code'] == 'CASHFLOW.CATEGORY_ACCOUNT_NOT_AN_EXPENSE', result
          "

      - name: Tear down
        if: always()
        run: |
          kill "$(cat host.pid)" 2>/dev/null || true
          docker compose down -v
