# Implements gates 1–3 of the 12-gate pipeline in docs/03-architecture/09-devops-and-cicd.md §3
# (build & analysers, architecture tests, unit + property tests) — the gates that have real content
# to run against as of M0 Slice 1. Gates 4–8 and 10–12 (golden files, determinism, historical
# corpus, contract tests, no-frills build, rule coverage, Bicep what-if, Flutter) arrive as the
# slices that give them something to check land; gate 9 (security scans) is worth adding on its own
# regardless of which slice, next.
name: PR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & analysers, architecture tests, unit + property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - run: dotnet restore atlas.sln

      - run: dotnet build atlas.sln --no-restore --configuration Release

      - run: dotnet format atlas.sln --verify-no-changes --no-restore

      - run: dotnet test atlas.sln --no-build --configuration Release

  local-dev-smoke:
    # A continuously-verified proof of NFR-609's documented local-dev path (docs/03-architecture/
    # 09-devops-and-cicd.md §7), not a claim in a README nobody re-checks.
    name: docker-compose local dev smoke test (NFR-609)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: docker compose up
        run: docker compose up -d --wait

      - name: Run Atlas.Host in the background
        run: |
          dotnet run --project src/Atlas.Host --urls http://localhost:5299 &
          echo $! > host.pid

      - name: Wait for the host to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5299/health; then exit 0; fi
            sleep 2
          done
          echo "Host never became healthy" >&2
          exit 1

      # The M0 exit gate's "1,000 synthetic entries post, balance, and query correctly at arbitrary
      # bitemporal coordinates" (docs/01-product/08-roadmap-and-milestones.md), proven on every push:
      # atlas-seed posts a 10-year synthetic life and independently verifies every balance it checks.
      - name: Seed and verify (M0 exit gate)
        run: dotnet run --project tools/atlas-seed -- --years 10 --seed 42 --host http://localhost:5299

      - name: Tear down
        if: always()
        run: |
          kill "$(cat host.pid)" 2>/dev/null || true
          docker compose down -v
