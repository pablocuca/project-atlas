# Local dev only (docs/03-architecture/09-devops-and-cicd.md §7).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_local_dev
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - atlas-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Blob storage emulator — added in M1 Slice 1, when raw payload archival (FR-112) became the
  # first thing that actually needed it (data-strategy.md assigns raw payloads to Blob, not
  # Postgres). Blob endpoint only; table/queue are unused.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.34.0
    command: "azurite-blob --blobHost 0.0.0.0 --loose"
    ports:
      - "10000:10000"
    volumes:
      - atlas-azurite-data:/data

volumes:
  atlas-postgres-data:
  atlas-azurite-data:
